[package]
name = "database-storage"
rust-version.workspace = true
version.workspace = true
edition = "2021"

[dependencies]
core-domain = { path = "../core-domain" }
config-models = { path = "../config-models" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
chrono = "0.4"
base64 = "0.22"
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
rust_decimal = { version = "1.34", features = ["serde-with-str"] }
rust_decimal_macros = "1"

[dev-dependencies]
market-analyzer = { path = "../market-analyzer" }
