[package]
name = "api-gateway"
rust-version.workspace = true
version = "0.1.0"
edition = "2021"

[dependencies]
futures-util = { version = "0.3", features = ["sink", "std"] }

core-domain = { path = "../core-domain" }
config-models = { path = "../config-models" }
market-analyzer = { path = "../market-analyzer" }
database-storage = { path = "../database-storage" }
portfolio-supervisor = { path = "../portfolio-supervisor" }
performance-analytics = { path = "../performance-analytics" }
backtesting-engine = { path = "../backtesting-engine" }
network-adapters = { path = "../network-adapters" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rust_decimal = { version = "1.34", features = ["serde-with-str"] }
rust_decimal_macros = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
axum = { version = "0.7", features = ["ws", "json"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
chrono = "0.4"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
hyper = { version = "1", features = ["server"] }
http-body-util = "0.1"
reqwest = { version = "0.12", features = ["json"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = "0.26"
