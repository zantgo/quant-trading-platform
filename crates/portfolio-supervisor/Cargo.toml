[package]
name = "portfolio-supervisor"
rust-version.workspace = true
version = "0.1.0"
edition = "2021"

[dependencies]
futures-util = { version = "0.3", features = ["std"] }

core-domain = { path = "../core-domain" }
config-models = { path = "../config-models" }
market-analyzer = { path = "../market-analyzer" }
database-storage = { path = "../database-storage" }
network-adapters = { path = "../network-adapters" }
serde = { version = "1.0", features = ["derive"] }
async-trait = "0.1"
serde_json = "1.0"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
rust_decimal = { version = "1.34", features = ["serde-with-str"] }
rust_decimal_macros = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
