[package]
name = "execution-daemon"
rust-version.workspace = true
version.workspace = true
edition = "2021"

[lib]
name = "execution_daemon"
path = "src/lib.rs"

[[bin]]
name = "execution-daemon"
path = "src/main.rs"

[dependencies]
core-domain = { path = "../core-domain" }
config-models = { path = "../config-models" }
market-analyzer = { path = "../market-analyzer" }
database-storage = { path = "../database-storage" }
network-adapters = { path = "../network-adapters" }
portfolio-supervisor = { path = "../portfolio-supervisor" }
performance-analytics = { path = "../performance-analytics" }
backtesting-engine = { path = "../backtesting-engine" }
api-gateway = { path = "../api-gateway" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
axum = { version = "0.7", features = ["ws", "json"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
rust_decimal = { version = "1.34", features = ["serde-with-str"] }
rust_decimal_macros = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
