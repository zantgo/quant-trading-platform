[package]
name = "core-domain"
rust-version.workspace = true
version.workspace = true
edition = "2021"
# Resolves the SPEC and BUILD identity at compile time (V-101). Cargo only
# forwards a fixed set of CARGO_PKG_* variables, so `build.rs` reads the
# workspace `[workspace.package]` table directly -- which also means both
# version lines live in exactly one greppable file.
build = "build.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rust_decimal = { version = "1.34", features = ["serde-float"] }
tokio = { version = "1", features = ["sync", "rt", "macros"] }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

[dev-dependencies]
rust_decimal_macros = "1"
proptest = "1"
market-analyzer = { path = "../market-analyzer" }
trybuild = "1.0.116"
