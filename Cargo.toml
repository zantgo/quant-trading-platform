[workspace]
members = [
    "crates/core-domain",
    "crates/config-models",
    "crates/market-analyzer",
    "crates/database-storage",
    "crates/network-adapters",
    "crates/portfolio-supervisor",
    "crates/performance-analytics",
    "crates/backtesting-engine",
    "crates/api-core",
    "crates/api-market",
    "crates/api-instances",
    "crates/api-analytics",
    "crates/api-system",
    "crates/api-gateway",
    "crates/execution-daemon",
]
resolver = "2"

# Declared toolchain floor (inherited by every crate; used by clippy's
# MSRV lint family and by toolchain managers). The codebase already uses
# `std::sync::LazyLock` (stable 1.80) and `let ... else` (stable 1.65),
# so 1.80 is the floor.
# ---------------------------------------------------------------------------
# Build cost profiles (v11.14.2)
#
# These crates previously built on stock Rust defaults, i.e. `debug = true`
# (FULL debuginfo) with `split-debuginfo = 'off'`, which on Linux embeds a
# complete copy of the debuginfo for the ENTIRE dependency tree in every
# artifact. Measured on one integration-test binary:
#
#     .debug_info     115.5 MB      35%      .text (the actual code)
#     .debug_str       97.7 MB      30%       31.8 MB        10%
#     other .debug_*   ~35   MB      11%
#                                  ----
#                                  326 MB total
#
# A/B measured on `api-gateway --test mode_at_creation` (identical work each
# time: recompile one test crate, then link):
#
#     variant                              link      binary
#     stock (debug = true)                 9.89 s    326 MB
#     debug = 1                          6.41 s    185 MB   <- adopted
#     debug = 1 + split-debuginfo         27.81 s    96 MB
#     + opt-level = 1 on deps
#
# So `debug = 1` is faster AND smaller: it keeps line tables, meaning
# backtraces, panic locations and `cargo test --nocapture` stay accurate, and
# only gdb's variable inspection / pretty-printing is given up.
#
# `split-debuginfo = "unpacked"` and `opt-level = 1` on dependencies were both
# tried and REJECTED: together they made linking ~4x slower (27.81 s vs 6.41 s).
# The extra 96 MB was not worth a 4x link regression, and optimised
# dependencies buy nothing here -- the daemon is release-built, and test
# runtimes are already seconds, not minutes.
# ---------------------------------------------------------------------------
[profile.dev]
debug = 1

[profile.test]
debug = 1

[workspace.package]
rust-version = "1.80"

# ---------------------------------------------------------------------------
# THE TWO VERSION LINES (V-101, V-104)
#
# They are deliberately separate numbers and they advance independently.
# A reader comparing two published model documents must be able to tell
# "the specification moved" from "the binary moved" -- which is impossible
# if both fields carry the same string.
#
#   version      = the CODE line   -- what the git tag names (v4.0.0)
#   spec-version = the DOCS line   -- what the corpus is stamped (12.0.0)
#
# `crates/core-domain/build.rs` reads this table and resolves both into
# compile-time constants; `core_domain::SPEC_VERSION` / `CODE_VERSION` /
# `BUILD_VERSION` are the only sanctioned sources (invariant N4). `tests/
# version_identity.rs` reads them back out of the sources, so editing this
# table without the rest of the scheme failing is not possible.
# ---------------------------------------------------------------------------

# The CODE version line, inherited by every member as `version.workspace = true`.
version = "4.0.0"

# ---------------------------------------------------------------------------
# The DOCS/SPEC version line.
#
# It lives under `workspace.metadata` rather than beside `version` because
# cargo forwards only a fixed set of `CARGO_PKG_*` variables to build scripts --
# an arbitrary `[workspace.package]` key is reported as an "unused manifest
# key". `[workspace.metadata]` is cargo's sanctioned home for non-standard
# data, and `build.rs` reads it from there.
# ---------------------------------------------------------------------------
[workspace.metadata.platform]
# The specification this code implements. Distinct from `version` above.
spec-version = "12.0.0"

# Single source of truth for clippy / rust correctness lints. Only
# the "correctness" lints (those that catch real bugs or future-hard-
# errors) are promoted to deny. Style / micro-perf lints stay at warn
# so they show up in `cargo check` output but don't block CI.
[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
# Correctness lints
await_holding_lock = "deny"
items_after_test_module = "deny"
needless_collect = "warn"
redundant_clone = "warn"

# `static_mut_refs` is a future hard-error in Rust 2024; deny it now
# so we don't accumulate violations.
static_mut_refs = "deny"

# Apply the lint policy across every member crate by default.
[workspace.lints]
# (Individual lints are in the [workspace.lints.clippy] / [workspace.lints.rust]
#  tables above; this `[workspace.lints]` block ensures cargo propagates
#  them. Crate-specific overrides are not expected — if a crate needs
#  to opt out of a lint, use `#[allow(...)]` with a documented reason
#  at the call site rather than mutating the workspace policy.)
