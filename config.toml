[clock_monitor]
enabled = true
ntp_servers = [
    "pool.ntp.org",
    "time.aws.com",
    "time.google.com",
    "time.cloudflare.com",
]
poll_interval_secs = 30
threshold_micros = 10000
query_timeout_secs = 5
jitter_window_size = 20
