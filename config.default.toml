# ==============================================================================
# Trading Platform — config.toml (canonical, v6.0+)
# ==============================================================================
#
# This is the ONLY config file the platform reads. `instances.json`,
# `workspaces.json`, and `pairs.json` are no longer recognized — if any of
# them is present at startup, the daemon panics with a migration pointer.
#
# Hierarchy: PLATFORM > WORKSPACE > INSTANCE
#   [server]                   ← HTTP bind/port (one per folder/session)
#   [hyperliquid]/[bitget]/…   ← exchanges, clock, quality (one binary)
#   [workspace]                ← portfolio + analytics + strategies (one per binary)
#   [[workspace.instances]]    ← trading pairs (zero or more)
#
# See docs/conceptual-foundations/01-07-data-model-hierarchy.md for the full
# schema, worked examples, and the "which setting belongs where" rules.

# ──────────────────────────────────────────────────────────────────────────────
# PLATFORM
# ──────────────────────────────────────────────────────────────────────────────

# HTTP server the dashboard + WebSocket are served from. Loopback-only by
# default (K1 security boundary). For multi-folder / multi-session setups
# on one machine, give each folder its own port (e.g. 3000, 3001, 3002) —
# each folder carries its own config.toml + telemetry.db, so the sessions
# are fully isolated. Overridable per launch: `PLATFORM_PORT`/`PLATFORM_BIND`
# env vars or `--port`/`--bind` CLI flags (flag > env > this section).
[server]
bind = "127.0.0.1"
port = 3000

[hyperliquid]
ws_url = "wss://api.hyperliquid.xyz/ws"

[bitget]
ws_url = "wss://ws.bitget.com/v2/ws/public"

# Clock-drift monitor: enforces the platform's <=10000µs UTC drift budget via
# continuous NTP polling. Set `enabled = false` to disable drift enforcement.
[clock_monitor]
enabled = true
ntp_servers = ["pool.ntp.org", "time.aws.com", "time.google.com", "time.cloudflare.com"]
poll_interval_secs = 30
threshold_micros = 10000
query_timeout_secs = 5
jitter_window_size = 20
breach_action = "warn"
warn_on_breach = true

# ──────────────────────────────────────────────────────────────────────────────
# WORKSPACE — "all engines running my program"
# ──────────────────────────────────────────────────────────────────────────────
#
# This is the user's portfolio + analytics + strategy + market-monitor
# settings. Exactly ONE workspace per binary. Per-instance fields (symbol,
# timeframes, indicator overrides) live inside `[[workspace.instances]]` below.

[workspace]
id = "main"
name = "My Portfolio"

# Settlement currency + preferred exchange applied to new instances that
# don't override them.
default_currency = "USDC"
default_exchange = "Hyperliquid"

# Active timeframes as durations in seconds (fastest -> slowest), any
# subset of the 14-slot pool [1, 3, 5, 15, 30, 60, 180, 300, 900, 1800,
# 3600, 14400, 43200, 86400]. Shown default: the fastest eight.
timeframes = [1, 3, 5, 15, 30, 60, 180, 300]

# ── TAE v7 setup executor (master switch) ──
# enabled = true keeps the 1s setup-executor loop running: fills, setup
# evaluation, equity sync, PME safety updates, STOP flatten, funding.
[workspace.minimal_tae]
enabled = true           # setup executor master switch
risk_per_trade_pct = 1.0
min_net_rr = 1.0
max_position_size_usd = 200.0
max_open_positions = 1
entry_mode = "zone_midpoint"
invalidate_on = "direction_flip"

# ── Market-monitor defaults (per-instance inheritance) ──

[workspace.candles]
duration_seconds = 60

# Canonical candle-buffer tiers (CB-01) — three independent numbers:
#   300 = INDICATORS_MAX_BARS_REQUIRED  (indicator calculation floor)
#   500 = [candle_buffer] size          (historical warmup fetched from REST)
#   1000 = HIST_BUFFER_MAX              (absolute in-memory cap, sub-minute
#                                        and above-minute, same behavior)
[candle_buffer]
size = 500

[workspace.fast_timeframe]
enabled = true
duration_seconds = 180

[workspace.slow_timeframe]
enabled = true
duration_seconds = 300

[workspace.macro_timeframe]
enabled = true
duration_seconds = 900

[workspace.indicators]
ema_fast = 10
ema_medium = 50
ema_slow = 100
ema_long = 200
rsi_period = 14
macd_fast = 12
macd_slow = 26
macd_signal = 9
adx_period = 14
atr_period = 14
squeeze_period = 20
stoch_k_period = 18
stoch_d_period = 5
stoch_s_period = 9
chandemo_period = 12
supertrend_period = 10
supertrend_multiplier = 3.0
keltner_ema_period = 20
keltner_atr_period = 10
keltner_multiplier = 2.0
donchian_period = 20
obv_smoothing = 20
cmf_period = 20
mfi_period = 14
hv_period = 20
aroon_period = 25
chop_period = 14
linreg_period = 20
zscore_period = 20
bbwp_lookback = 252
bbwp_period = 20
macd_extreme_high_threshold = 1000.0
macd_extreme_low_threshold = -1000.0
macd_histogram_contraction_threshold = 0.3
adx_trend_threshold = 20
adx_exhaustion_threshold = 40
adx_slope_lookback = 3
squeeze_min_duration = 5
squeeze_bb_period = 20
squeeze_bb_std_dev = 2.0
squeeze_kc_period = 20
squeeze_kc_atr_multiplier = 1.5
atr_multiplier_coefficient = 2.0
atr_target_rr_ratio = 2.5
volume_average_period = 20
rvol_threshold_institutional = 1.5
rvol_threshold_climax = 3.0
ichimoku_tenkan = 9
ichimoku_kijun = 26
ichimoku_senkou_b = 52
ichimoku_displacement = 26
cci_period = 20
psar_af_step = 0.02
psar_af_max = 0.2
williams_r_period = 14
hull_ma_period = 21
force_index_smoothing = 13
stddev_channel_period = 20
smc_lookback = 20
volume_profile_bins = 50
volume_profile_window = 500
volume_profile_value_area = 0.7

[fibonacci]
swing_lookback = 10
swing_scan_range = 120
retracement_coefficients = [0.236, 0.382, 0.5, 0.618, 0.66, 0.786]
extension_coefficients = [1.272, 1.618, 2.0, 2.618]

[pivots]
strength_n = 10
scan_range_candles = 120
sr_proximity_threshold_pct = 0.5
sr_flip_tolerance_pct = 0.3
pattern_slope_tolerance = 0.2

[leverage]
cross_leverage = 20

[scoring]
base_allocation_pct = 1.0
micro_allocation_pct = 2.0
max_allocation_pct = 3.0
base_score_threshold = 40
micro_score_threshold = 60

[defaults]
default_pair = "BTC/USDT"

# ── PME safety: dropout thresholds, capital drawdown veto ──

[workspace.safety]
consecutive_loss_caution = 3
consecutive_loss_dropout = 5
dropout_duration_hours = 8
drawdown_limit_pct = 30.0
max_daily_drawdown_pct = 5.0
systemic_risk_threshold = 80

# ── TAE fees: applied to Position Sizing Protocol unless an instance overrides ──

[workspace.fees]
maker_fee_pct = 0.02
taker_fee_pct = 0.06
funding_rate_8h = 0.01

# ── PAE scheduler cadences: portfolio equity logger + performance evaluator ──

[workspace.intervals]
slow_seconds = 3600
normal_seconds = 900
fast_seconds = 300

# ── Liquidity Intelligence (Phase 0-4) ──

[workspace.liquidity]
enabled = true
mark_price_poll_ms = 60000
event_retention_days = 90
bucket_retention_days = 7
cluster_refresh_secs = 300
maintenance_margin_rate = 0.005
cascade_detected_zscore = 2.5
cascade_sustained_events = 3
funding_extreme_pct = 0.0005
magnet_activation_distance_pct = 0.5
liquidity_vacuum_threshold = 0.3
oi_funding_divergence_pct = 2.0
min_cluster_notional_usd = 50000
# Hyperliquid has no public liquidation feed — liquidations arrive on
# `userFills` which is account-scoped. Set to your HL wallet address
# (40-hex chars, 0x-prefixed) to enable HL liquidations.
hyperliquid_user_address = ""

# ── Liquidation Heatmap (Block B/C/D) ──
# Price-bucketed real-event aggregation overlaid on the estimated
# cluster matrix. Display-only — does not feed `cascade_risk` or
# `LiquiditySqueeze`. Block A (Bitget's public `liquidation` channel)
# populates the real layer; Hyperliquid without `hyperliquid_user_address`
# stays empty on the real layer and surfaces a caveat watermark.

[workspace.heatmap]
enabled = true
bucket_size_pct = 0.001        # 0.1% bins relative to mid-price
retention_secs = 86400         # 24-hour rolling window
render_real = true
render_estimated = true
render_hl_caveat = true

# ──────────────────────────────────────────────────────────────────────────────
# INSTANCES — trading pairs
# ──────────────────────────────────────────────────────────────────────────────
#
# Each `[[workspace.instances]]` block is one trading pair. Every instance
# runs the durations declared by `[workspace].timeframes` (fastest ->
# slowest); a timeframe IS its duration in seconds. Per-duration indicator
# overrides are optional and keyed by the duration in seconds:
#
# Add instances below, e.g.:
#
# [[workspace.instances]]
# id = "btc"
# symbol = "BTC-USDT"
# quote = "USDT"
# status = "running"
# operational_mode = "advisory"
#
# [workspace.instances.timeframes.60]
# candles = { duration_seconds = 60 }
# indicators = { rsi_period = 21 }